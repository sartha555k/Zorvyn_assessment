<style>

      position: relative;

      border-radius: 1rem;
      background: linear-gradient(135deg, rgba(0, 253, 135, 0.25), rgba(91, 177, 255, 0.25));

<div class="fixed inset-0 overflow-hidden blur-lg scale-105 pointer-events-none opacity-40">

<div class="flex gap-8 font-headline font-bold uppercase tracking-tight">

</div>
</nav>
<main class="pt-24 px-8 grid grid-cols-12 gap-6 max-w-7xl mx-auto">
<div class="col-span-8 space-y-6">
<div class="h-64 bg-surface-container-low rounded-xl"></div>
<div class="grid grid-cols-3 gap-6">
<div class="h-32 bg-surface-container-low rounded-xl"></div>
<div class="h-32 bg-surface-container-low rounded-xl"></div>
<div class="h-32 bg-surface-container-low rounded-xl"></div>
</div>

</div>
<div class="col-span-4 space-y-6">
<div class="h-[600px] bg-surface-container-low rounded-xl"></div>
</div>
</main>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-[100] flex items-center justify-center bg-background/40 backdrop-blur-[8px]">
<!-- Modal Container -->
<div class="relative w-[600px] bg-[#111118] rounded-xl shadow-[0_20px_60px_-15px_rgba(0,0,0,0.7)] neon-border p-8">
<!-- Close Button -->
<button class="absolute top-6 right-6 text-slate-500 hover:text-white transition-colors duration-200">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<!-- Header -->
<div class="flex items-center gap-3 mb-8">
<div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary-fixed" style="font-variation-settings: 'FILL' 1;">trending_up</span>
</div>
<h2 class="text-xl font-headline font-bold tracking-tight text-on-surface">MoM Performance</h2>
</div>
<!-- Content Layout -->
<div class="space-y-10">
<!-- Main Stats -->
<div class="text-center">
<div class="font-mono text-7xl font-bold tracking-tighter text-primary-fixed drop-shadow-[0_0_15px_rgba(0,253,135,0.3)]">
            +14.2%
          </div>
<div class="mt-2 text-slate-400 font-medium">Growth vs last month</div>
</div>
<!-- Comparison Chart (Bento Style Vertical Bars) -->
<div class="flex justify-around items-end h-48 px-12 relative">
<!-- Background Grid Lines -->
<div class="absolute inset-x-0 bottom-0 border-b border-white/5 w-full"></div>
<!-- Bar 1 (May) -->
<div class="flex flex-col items-center group">
<div class="font-mono text-sm text-slate-500 mb-2">$84.2K</div>
<div class="w-24 bg-surface-container-highest rounded-t-lg h-32 transition-all duration-500 group-hover:bg-surface-bright"></div>
<div class="mt-4 text-xs font-bold font-headline uppercase tracking-widest text-slate-500">May</div>
</div>
<!-- Bar 2 (June) -->
<div class="flex flex-col items-center group">
<div class="font-mono text-sm text-primary-fixed-dim mb-2">$96.1K</div>
<div class="w-24 bg-gradient-to-t from-primary-container to-tertiary-container rounded-t-lg h-40 shadow-[0_0_30px_rgba(0,253,135,0.15)] group-hover:scale-x-105 transition-transform"></div>
<div class="mt-4 text-xs font-bold font-headline uppercase tracking-widest text-primary">June</div>
</div>
</div>
<!-- AI Insights Section -->
<div class="relative overflow-hidden rounded-xl bg-surface-container-low p-6 border border-white/5">
<!-- Subtle Glow Background -->
<div class="absolute -right-20 -top-20 w-40 h-40 bg-primary/10 blur-[60px]"></div>
<div class="flex items-start gap-4">
<div class="flex-shrink-0 mt-1">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<div class="flex-1">
<h3 class="font-headline font-bold text-on-surface flex items-center gap-2">
                Smart Analysis
              </h3>
<p class="mt-1 text-sm text-slate-400 leading-relaxed">
                The recent surge is primarily driven by institutional inflow in the <span class="text-white font-medium">Terminal Strategy</span> sector. Predicted retention for next month is <span class="text-primary-fixed">92%</span>.
              </p>
<button class="mt-6 w-full flex items-center justify-center gap-2 py-3 px-4 rounded-lg font-bold font-headline text-sm bg-gradient-to-r from-primary to-tertiary text-on-primary hover:opacity-90 active:scale-[0.98] transition-all">
                Deep Dive Analysis
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
